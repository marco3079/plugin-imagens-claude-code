<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <!--
    MODELO svg-logo: prancha de marca num arquivo só.
    Renderize com:  node scripts/renderizar.mjs logo.svg logo.png

    Como está montado:
    - O símbolo é desenhado UMA vez, numa grade de 160 x 160 com o centro em 0,0, dentro de <symbol>.
      Todas as versões (cor, uma cor, negativa, reduzida) reutilizam o mesmo desenho com <use>.
    - As cores são variáveis CSS no topo. Trocar a marca de cor é mudar três linhas.
    - A versão reduzida é OUTRO desenho (menos detalhe, traço mais grosso), não o mesmo encolhido.
    - O nome está em texto vivo com pilha de fontes do sistema. Para arquivo final de gráfica,
      converta em contorno num editor vetorial: a fonte muda de máquina para máquina.

    Construção do símbolo (gota): círculo de raio 38 com centro em (0,18); a ponta fica em (0,-58),
    a duas vezes o raio do centro. As laterais chegam ao círculo no ponto de tangência (±32.91,-1),
    com a alça de controle alinhada à tangente do círculo, para não deixar quina no ombro.
  -->
  <style>
    :root { --tinta: #0E4D5C; --apoio: #1F7A8C; --papel: #F6F3EC; --acento: #E9A23B; --texto: #12343C; }
    .nome { font-family: "Segoe UI", "Helvetica Neue", "Noto Sans", Arial, sans-serif; font-weight: 600; letter-spacing: -0.035em; }
    .linha { font-family: "Segoe UI", "Helvetica Neue", "Noto Sans", Arial, sans-serif; font-weight: 600; letter-spacing: 0.30em; }
    .nota { font-family: "Segoe UI", "Helvetica Neue", "Noto Sans", Arial, sans-serif; font-size: 15px; letter-spacing: 0.12em; fill: #6C7F84; }
  </style>
  <defs>
    <path id="gota" d="M0,-58 C4,-38 17.9,-27 32.91,-1 A38,38 0 1 1 -32.91,-1 C-17.9,-27 -4,-38 0,-58 Z"/>
    <clipPath id="recorte-gota"><use href="#gota"/></clipPath>

    <!-- Símbolo completo: gota com duas ondas em negativo. As ondas sangram pela borda (o recorte corta). -->
    <symbol id="simbolo" viewBox="-80 -80 160 160">
      <use href="#gota" fill="var(--cor-simbolo, var(--tinta))"/>
      <g clip-path="url(#recorte-gota)" fill="none" stroke="var(--cor-vazio, var(--papel))" stroke-width="6.5">
        <path d="M-56,13 q8,-9 16,0 t16,0 t16,0 t16,0 t16,0 t16,0 t16,0"/>
        <path d="M-56,32 q8,-9 16,0 t16,0 t16,0 t16,0 t16,0 t16,0 t16,0" stroke="var(--cor-onda2, var(--cor-vazio, var(--papel)))"/>
      </g>
    </symbol>

    <!-- Símbolo mínimo (até 20 px): só a gota. Abaixo de 20 px a onda vira sujeira. -->
    <symbol id="simbolo-minimo" viewBox="-62 -62 124 124"><use href="#gota" fill="var(--cor-simbolo, var(--tinta))"/></symbol>

    <!-- Símbolo reduzido (16 a 48 px): uma onda só, mais grossa, e gota ocupando mais da caixa. -->
    <symbol id="simbolo-reduzido" viewBox="-66 -66 132 132">
      <use href="#gota" fill="var(--cor-simbolo, var(--tinta))"/>
      <g clip-path="url(#recorte-gota)" fill="none" stroke="var(--cor-vazio, var(--papel))" stroke-width="11">
        <path d="M-60,22 q10,-12 20,0 t20,0 t20,0 t20,0 t20,0 t20,0"/>
      </g>
    </symbol>
  </defs>

  <!-- ============ 1. Versão principal: símbolo + nome, sobre o papel ============ -->
  <rect width="1600" height="1000" fill="var(--papel)"/>
  <g transform="translate(225,120)" style="--cor-onda2:#E9A23B">
    <use href="#simbolo" x="15" y="-66" width="360" height="360"/>
    <!-- A altura do x do nome fica alinhada ao corpo redondo da gota; a base, com a onda de baixo. -->
    <text class="nome" x="330" y="236" font-size="190" fill="var(--tinta)">nascente</text>
    <text class="linha" x="340" y="296" font-size="25" fill="var(--apoio)">ÁGUA MINERAL NATURAL</text>
  </g>

  <line x1="100" y1="520" x2="1500" y2="520" stroke="#D9D4C7" stroke-width="2"/>

  <!-- ============ 2. Uma cor, sobre papel ============ -->
  <g transform="translate(100,570)">
    <rect width="440" height="300" rx="14" fill="#FCFAF6"/>
    <g style="--cor-simbolo:#111111; --cor-vazio:#FCFAF6">
      <use href="#simbolo" x="32" y="90" width="120" height="120"/>
    </g>
    <text class="nome" x="150" y="176" font-size="70" fill="#111111">nascente</text>
    <text class="nota" x="0" y="336">UMA COR</text>
  </g>

  <!-- ============ 3. Negativa, sobre a cor da marca ============ -->
  <g transform="translate(580,570)">
    <rect width="440" height="300" rx="14" fill="var(--tinta)"/>
    <g style="--cor-simbolo:#F6F3EC; --cor-vazio:#0E4D5C">
      <use href="#simbolo" x="32" y="90" width="120" height="120"/>
    </g>
    <text class="nome" x="150" y="176" font-size="70" fill="var(--papel)">nascente</text>
    <text class="nota" x="0" y="336">NEGATIVA</text>
  </g>

  <!-- ============ 4. Ícone de aplicativo e tamanhos reduzidos ============ -->
  <g transform="translate(1060,570)">
    <rect width="440" height="300" rx="14" fill="#FCFAF6"/>
    <g style="--cor-simbolo:#F6F3EC; --cor-vazio:#0E4D5C">
      <rect x="36" y="78" width="144" height="144" rx="32" fill="var(--tinta)"/>
      <use href="#simbolo-reduzido" x="52" y="94" width="112" height="112"/>
    </g>
    <use href="#simbolo-reduzido" x="216" y="118" width="64" height="64"/>
    <use href="#simbolo-reduzido" x="304" y="134" width="32" height="32"/>
    <use href="#simbolo-minimo" x="362" y="142" width="16" height="16"/>
    <text class="nota" x="216" y="214">64</text><text class="nota" x="304" y="214">32</text><text class="nota" x="362" y="214">16</text>
    <text class="nota" x="0" y="336">REDUZIDA E ÍCONE</text>
  </g>

  <!-- ============ 5. Paleta ============ -->
  <g transform="translate(100,940)">
    <rect x="0" y="0" width="56" height="22" rx="4" fill="var(--tinta)"/><text class="nota" x="68" y="17">#0E4D5C</text>
    <rect x="200" y="0" width="56" height="22" rx="4" fill="var(--apoio)"/><text class="nota" x="268" y="17">#1F7A8C</text>
    <rect x="400" y="0" width="56" height="22" rx="4" fill="var(--acento)"/><text class="nota" x="468" y="17">#E9A23B</text>
    <rect x="600" y="0" width="56" height="22" rx="4" fill="var(--papel)" stroke="#D9D4C7"/><text class="nota" x="668" y="17">#F6F3EC</text>
  </g>
</svg>
