<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Fabrica uma foto danificada para testar a restauração</title>
<style>html, body { margin: 0; } canvas { display: block; }</style></head>
<body><canvas id="tela"></canvas>
<script>
// Estraga original.png de propósito: desbota, amarela, levanta os pretos, põe ruído, riscos e poeira.
// node scripts/renderizar.mjs danificar.html danificada.png --canvas "#tela"
window.IMAGEM_PRONTA = false;
function acaso(s){ let a = s >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = acaso(41), normal = () => Math.sqrt(-2 * Math.log(R() + 1e-9)) * Math.cos(6.2832 * R());
const img = new Image();
img.onload = () => {
  const c = document.getElementById('tela'); c.width = img.naturalWidth; c.height = img.naturalHeight;
  const g = c.getContext('2d'), W = c.width, H = c.height; g.drawImage(img, 0, 0);
  const im = g.getImageData(0, 0, W, H), d = im.data;
  for (let i = 0; i < d.length; i += 4) {
    const y = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
    const cor = [1.00, 0.93, 0.74];                                  // véu amarelado
    for (let k = 0; k < 3; k++) {
      let v = y + (d[i + k] - y) * 0.45;                             // desbotado: perde 55% da saturação
      v = v * 0.58 + 70;                                             // contraste baixo e pretos levantados
      v = v * cor[k] + normal() * 13;                                // dominante e ruído gaussiano (sigma 13)
      d[i + k] = v;
    }
  }
  g.putImageData(im, 0, 0);
  g.lineCap = 'round';
  for (let i = 0; i < 16; i++) {                                     // riscos: finos, quase verticais, levemente curvos
    const x = R() * W, y = R() * H * 0.7, comp = (0.15 + 0.6 * R()) * H, inc = (R() - 0.5) * 80;
    g.strokeStyle = `rgba(${235 + R() * 20 | 0},${230 + R() * 20 | 0},${215 + R() * 20 | 0},${0.7 + 0.3 * R()})`; g.lineWidth = 1 + R() * 1.6;
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + inc * R(), y + comp / 2, x + inc, y + comp); g.stroke();
  }
  for (let i = 0; i < 90; i++) {                                     // poeira clara e manchas escuras
    const claro = R() < 0.7; g.fillStyle = claro ? 'rgba(240,236,224,0.9)' : 'rgba(40,34,28,0.85)';
    g.beginPath(); g.arc(R() * W, R() * H, 0.8 + R() * R() * 3.2, 0, 7); g.fill();
  }
  window.IMAGEM_PRONTA = true;
};
img.src = 'original.png';
</script></body></html>
